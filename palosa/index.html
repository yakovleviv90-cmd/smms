<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-title" content="Сммс · пало·са">
<title>Редактор пало·са</title>
<style>html,body{height:100%;margin:0}iframe{display:block;width:100%;height:100%;border:0}a{font:16px system-ui}</style>
</head><body>
<a href="/palosa-studio/">Открыть редактор пало·са по новому адресу</a>
<script>
const link=document.querySelector('a');
if(matchMedia('(display-mode: standalone)').matches || navigator.standalone){
  // Keep the storage context of an existing iPhone Home Screen installation.
  const editor=document.createElement('iframe');
  editor.title='Редактор пало·са';
  editor.src=link.href;
  link.replaceWith(editor);
} else {
  location.replace(link.href);
}
</script></body></html>
